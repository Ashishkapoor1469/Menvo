version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-menvo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./menvo-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-menvo}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./menvo-forntend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/menvo/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
